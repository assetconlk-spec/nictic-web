<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/aboutUs/logo-high-res.png" />
    <link rel="apple-touch-icon" href="/images/aboutUs/logo-high-res.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nictic | Sri Lanka Tourism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      #loader {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease;
      }
      #loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #loader-spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 4px solid #e5e7eb;
        border-top-color: #0d9488;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div id="loader-spinner"></div>
    </div>

    <div id="root"></div>
    <script>
      (function () {
        var img = new Image();
        img.src = '/images/aboutUs/logo-high-res.png';
        img.onload = function () {
          var canvas = document.createElement('canvas');
          canvas.width = 64;
          canvas.height = 64;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 64, 64);
          ctx.globalCompositeOperation = 'source-atop';
          ctx.fillStyle = '#AC8E60';
          ctx.fillRect(0, 0, 64, 64);
          var link = document.querySelector("link[rel~='icon']");
          if (link) link.href = canvas.toDataURL();
        };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
